[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cine-cas-phile"
version = "1.0.0"
description = "Explainable MovieLens recommendations with a cinema club web interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "fastapi>=0.104,<1", "uvicorn>=0.24,<1", "pydantic>=2.4,<3", "tabulate>=0.9,<1", "pillow>=10,<13", "onnxruntime>=1.17,<2", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10", "httpx>=0.27,<1"]
neural = ["torch>=2.1,<3"]

[project.scripts]
cine-cas-phile = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

